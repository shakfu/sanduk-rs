# earendil-works' `pi -p --mode json`. It reads providers from models.json in its config
# directory, which the image's entrypoint writes from SANDUK_MODELS_JSON: in the container's home,
# not the bind mount.
name = "pi"
description = "pi; speaks all three protocols"
recipe = "pi"
skills_dir = ".agents/skills"
# In PI_CODING_AGENT_DIR, which the recipe sets to ~/.pi/agent.
instructions_file = ".pi/agent/AGENTS.md"
protocols = ["anthropic-messages", "openai-chat", "openai-responses"]
stream = "pi"

argv = [
  "--print", "--mode", "json",
  # Nothing outlives the container, so a session file is only a write.
  "--no-session",
  # The bind mount is the user's repository; its own config would steer the run.
  "--no-approve",
  "--model", "sanduk/{model}",
  # Everything after this is the task, whatever it starts with.
  "--",
  "{task}",
]

[check]
# The provider block lists the models pi may select, and --model picks one out of it.
require = ["model"]

# pi's `api` names, and Chat Completions before Responses where a provider serves both.
[vars.api]
from = "protocol"
map = { "anthropic-messages" = "anthropic-messages", "openai-chat" = "openai-completions", "openai-responses" = "openai-responses" }

# The anthropic-messages driver appends /v1/messages to what it is given, so that one gets the bare
# root. Measured: a base ending in /v1 sent it to /v1/v1/messages, which the relay refused.
[vars.prefix]
from = "protocol"
map = { "anthropic-messages" = "", "*" = "{api_prefix}" }

[wire]
key_env = "PI_RELAY_KEY"
base_url_env = "PI_RELAY_BASE_URL"
base_url = "{endpoint}{prefix}"

[wire.env.SANDUK_MODELS_JSON.json.providers.sanduk]
name = "sanduk relay"
baseUrl = "{base_url}"
api = "{api}"
# pi interpolates $NAME; measured against 0.85.1. The credential never goes in the file.
apiKey = "${key_env}"
models = [{ id = "{model}" }]
